# Builds the experiment image on a clean GitHub-hosted Ubuntu runner, records the
# measured environment, and commits the result back into the repository.
#
# Why this exists: the B machine has no Docker and the group decided not to
# install one, but the "Reproducibility and Environment" criterion needs a real
# build on a clean machine with recorded versions. A CI run is exactly that, and
# the log is permanent and auditable — which is also what "every reported number
# can be traced to the logs in the repository" asks for.
#
# The numbers describe the RUNNER (Ubuntu 22.04, its kernel, its Docker), not the
# students' laptops. Record that distinction in docs/environment.md under
# "Deviations".
name: environment

on:
  push:
    paths:
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/env.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          uname -a
          docker --version
          docker info --format '{{.OSType}} {{.Architecture}} {{.Driver}} {{.ServerVersion}}'
          python3 --version

      - name: Build images and capture environment
        shell: bash
        run: |
          set -uo pipefail
          # `bash script` instead of `./script`: on Windows checkouts the
          # executable bit can be lost, and a masked failure here would let a
          # broken image pass as "green".
          bash docker/verify.sh > env-L2.md 2>&1
          echo "verify.sh exit code: $?"
          cat env-L2.md
          # Assert on content instead of trusting the exit code: a build that
          # silently fell back to an older Go version must not go green.
          grep -q "go version go1.22" env-L2.md || { echo "::error::no go1.22 runtime in the measured block"; exit 1; }
          grep -q "PASS" env-L2.md || { echo "::error::-race detector did not report a data race"; exit 1; }

      - name: Publish the measured block into the repository
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p results/ci
          stamp="$(date -u +%Y%m%dT%H%MZ)"
          cp env-L2.md "results/ci/env-L2-${stamp}.md" 2>/dev/null || echo "(verify.sh produced no output)" > "results/ci/env-L2-${stamp}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ci
          git commit -m "ci: publish measured environment ${stamp} [skip ci]" || echo "nothing to commit"
          git push || echo "::warning::could not push the measurement back"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Measured environment (clean Ubuntu 22.04 runner)"
            echo
            sed -n '1,90p' env-L2.md || echo "_verify.sh produced no output_"
          } >> "$GITHUB_STEP_SUMMARY"

# Builds the experiment image on a clean GitHub-hosted Ubuntu runner and records
# the measured environment.
#
# Why this exists: the B machine has no Docker and the group decided not to
# install one, but the "Reproducibility and Environment" criterion needs a real
# build on a clean machine with recorded versions. A CI run is exactly that, and
# the log is a permanent, auditable permalink the report can cite.
#
# The numbers produced here describe the RUNNER (Ubuntu 22.04, its kernel,
# its Docker), not the students' laptops. Record that distinction in
# docs/environment.md under "Deviations".
name: environment

on:
  push:
    paths:
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/env.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          uname -a
          docker --version
          docker info --format '{{.OSType}} {{.Architecture}} {{.Driver}} {{.ServerVersion}}'
          python3 --version

      - name: Build images and capture environment
        run: |
          ./docker/verify.sh | tee env-L2.md

      - name: Upload the environment block
        uses: actions/upload-artifact@v4
        with:
          name: env-L2
          path: env-L2.md
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## Measured environment (clean Ubuntu 22.04 runner)"
            echo
            sed -n '1,80p' env-L2.md || echo "_verify.sh produced no output_"
          } >> "$GITHUB_STEP_SUMMARY"
